<script>
const firebaseConfig = {
  apiKey: "AIzaSyC0_DQIiyaVQllFH4pxH1Dm3r2kFXXoOgc",
  authDomain: "navrosetailorapp.firebaseapp.com",
  databaseURL: "https://navrosetailorapp-default-rtdb.asia-southeast1.firebasedatabase.app",

  appId: "1:574369461681:web:dbe9d417706ab0b5643990"
};
const C = (id, item, service, price, mins) => ({ id, item, service, price, mins, on: true });
const DEF_CAT = [
  C('pant-hem','Pant','Length Short (Hemming)',80,30), C('pant-fit','Pant','Waist / Fitting',150,60), C('pant-zip','Pant','Zip Change',100,30),
  C('shirt-slv','Shirt','Sleeve Short',120,45), C('shirt-fit','Shirt','Fitting',180,90), C('shirt-btn','Shirt','Button Fix',30,15),
  C('kurta-len','Kurta','Length Short',100,45), C('kurta-fit','Kurta','Fitting',180,90),
  C('blouse-fit','Blouse','Fitting',150,60), C('blouse-hook','Blouse','Hook / Button Fix',50,20),
  C('dress-fit','Dress','Fitting',250,120), C('saree-fall','Saree','Fall & Pico',120,60), C('dupatta-pico','Dupatta','Pico',60,30),
  C('pajama-elas','Pajama','Elastic Change',60,20), C('skirt-fit','Skirt','Waist Fitting',150,60), C('jacket-slv','Jacket','Sleeve Short',250,120),
  C('lengha-hem','Lengha','Hemming',300,180), C('rafu','Repair','Rafu / Patch',80,30)
];
const DEF = {
  open: true, shopName: 'Navrose Stitching Point', phone: '', upi: '', upiName: '', upiQr: '', closedMsg: 'Abhi Insta orders band hain. Kripya baad mein try karein.', notice: '',
  stages: [
    { id: 'placed', name: 'Booking Online', type: 'start' },
    { id: 'confirmed', name: 'Booking Confirmed', type: 'normal' },
    { id: 'processing', name: 'Alteration Processing', type: 'normal' },
    { id: 'ready', name: 'Ready for Pickup', type: 'ready' },
    { id: 'handover', name: 'Handover', type: 'final' }
  ],
  catalog: DEF_CAT
};
const ICONS = { pant:'👖', shirt:'👔', kurta:'🥻', blouse:'👚', dress:'👗', saree:'🥻', dupatta:'🧣', pajama:'🩳', skirt:'👗', jacket:'🧥', lengha:'👘', repair:'🧵', custom:'✍️' };
const iconOf = it => ICONS[String(it || '').toLowerCase().split(/[\s\/]/)[0]] || '🧵';

const $ = id => document.getElementById(id);
const esc = s => String(s === null || s === undefined ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
const arr = x => Array.isArray(x) ? x.filter(v => v !== null && v !== undefined) : (x && typeof x === 'object' ? Object.keys(x).map(k => x[k]) : []);
const num = v => { const n = parseFloat(v); return isNaN(n) ? 0 : n; };
const r2 = v => Math.round(v * 100) / 100;
const money = n => '₹' + r2(num(n)).toLocaleString('en-IN', { maximumFractionDigits: 2 });
const stClass = s => 'b-' + String(s || 'New').replace(/\s+/g, '');
const stLabel = s => ({ New: 'Confirm hona baaki', Confirmed: 'Confirmed', 'In Progress': 'Processing', Ready: 'Ready – Pickup Karein', Delivered: 'Handover Done', Rejected: 'Reject', Cancelled: 'Cancelled' }[s] || s || 'New');
const etaTxt = m => { m = Math.round(num(m)); if (m < 60) return m + ' min'; const h = Math.floor(m / 60), r = m % 60; return h + ' hr' + (r ? ' ' + r + ' min' : ''); };
function fmtDT(iso) { const d = new Date(iso); return isNaN(d) ? '' : d.toLocaleString('en-IN', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' }); }
function fmtT(ms) { return new Date(ms).toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' }); }
function normMobile(s) { let d = String(s || '').replace(/\D/g, ''); if (d.length > 10) d = d.slice(-10); return d.length === 10 ? d : null; }
let toastT;
function toast(m, ms) { const t = $('toast'); t.textContent = m; t.classList.remove('hide'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.add('hide'), ms || 3000); }
function lsGet(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { } }

let db = null, S = JSON.parse(JSON.stringify(DEF)), cat = 'All', query = '', cart = lsGet('instaCart', []), photos = [], busy = false, reqEta = 0;
const T = { orders: {}, refs: [], open: null, mobile: null };
cart = Array.isArray(cart) ? cart.filter(l => l && l.qty > 0) : [];

function initFirebase() {
  try {
    firebase.initializeApp(firebaseConfig);
    db = firebase.database();
    db.ref('instaSettings').on('value', snap => {
      const v = snap.val() || {};
      S = Object.assign({}, JSON.parse(JSON.stringify(DEF)), v);
      const c = arr(v.catalog); S.catalog = c.length ? c : DEF_CAT;
      const st = arr(v.stages); S.stages = st.length >= 2 ? st : DEF.stages;
      applySettings();
    }, () => { });
    db.ref('instaSlots').on('value', sn => { SLOTS = sn.val() || {}; drawSlotLine(); if (!$('ovCart').classList.contains('hide')) refreshSlotCard(); }, () => { });
    db.ref('instaSlotCap').on('value', sn => { SCAP = sn.val() || {}; drawSlotLine(); if (!$('ovCart').classList.contains('hide')) refreshSlotCard(); }, () => { });
  } catch (e) {
    console.error(e);
    $('netErr').textContent = '⚠ Server se connect nahi ho paya. Internet check karke page dobara kholein.';
    $('netErr').classList.remove('hide');
  }
}
const catalog = () => arr(S.catalog).filter(c => c && c.on !== false && (c.item || c.service));
function refreshSlotCard() { const keep = { n: ($('cName') || {}).value, m: ($('cMobile') || {}).value, t: ($('cNotes') || {}).value }; drawCart(); if (keep.n && $('cName')) $('cName').value = keep.n; if (keep.t && $('cNotes')) $('cNotes').value = keep.t; }
function applySettings() {
  if (S.otpApi === undefined) S.otpApi = '';
  $('shopName').textContent = S.shopName || DEF.shopName;
  document.title = (S.shopName || DEF.shopName) + ' – Insta Alterations';
  $('closed').textContent = '🔒 ' + (S.closedMsg || DEF.closedMsg);
  $('closed').classList.toggle('hide', S.open !== false);
  if (S.notice) { $('notice').textContent = '📢 ' + S.notice; $('notice').classList.remove('hide'); } else $('notice').classList.add('hide');
  // drop cart lines whose service was removed/disabled (custom lines stay)
  const ids = {}; catalog().forEach(c => ids[c.id] = c);
  cart.forEach(l => { if (l.sid && ids[l.sid]) { l.rate = num(ids[l.sid].price); l.mins = num(ids[l.sid].mins) || 30; } });
  cart = cart.filter(l => !l.sid || ids[l.sid]); lsSet('instaCart', cart);
  drawShop(); drawCartBar(); drawSlotLine(); if (typeof updateAlertChips === 'function' && $('alChips')) { try { updateAlertChips(); } catch (e) { } }
  if (!$('ovCart').classList.contains('hide')) drawCart();
  if (T.open) drawDetail();
  drawTrackList();
}

/* ---------- shop ---------- */
function drawShop() {
  { const ob = $('offersBar'); if (ob) ob.innerHTML = offersBarHtml(); }
  const all = catalog(), cats = ['All'].concat(Array.from(new Set(all.map(c => c.item).filter(Boolean))));
  if (cats.indexOf(cat) < 0) cat = 'All';
  $('cats').innerHTML = cats.map(c => `<button type="button" class="cat${c === cat ? ' on' : ''}" data-c="${esc(c)}">${c === 'All' ? '⚡ Sab' : esc(iconOf(c) + ' ' + c)}</button>`).join('');
  const ql = query.toLowerCase();
  const rows = all.filter(c => (cat === 'All' || c.item === cat) && (!ql || (c.item + ' ' + c.service).toLowerCase().indexOf(ql) >= 0));
  let h = `<div class="sec">${cat === 'All' ? 'Sabhi Alteration Services' : esc(cat)}</div><div class="grid">`;
  h += rows.map(c => {
    const inCart = cart.find(l => l.sid === c.id);
    return `<div class="pc"><div class="ic">${iconOf(c.item)}<span class="eta">⏱ ${esc(etaTxt(c.mins || 30))}</span></div><div class="nm">${esc(c.service || c.item)}</div><div class="it">${esc(c.item)}</div>
      <div class="bt"><span class="pr">${money(c.price)}</span>${inCart ? `<span class="step"><button type="button" data-dec="${esc(c.id)}" aria-label="Kam">−</button><span>${inCart.qty}</span><button type="button" data-inc="${esc(c.id)}" aria-label="Zyada">+</button></span>` : `<button type="button" class="add" data-add="${esc(c.id)}">ADD</button>`}</div></div>`;
  }).join('');
  const cu = cart.filter(l => l.custom).length;
  if (!ql || 'custom kuch aur'.indexOf(ql) >= 0) h += `<div class="pc"><div class="ic">✍️</div><div class="nm">Kuch aur / Custom</div><div class="it">Apni zarurat likhein</div><div class="bt"><span class="pr" style="font-size:.75rem;color:var(--mu)">Rate dukaan batayegi</span><button type="button" class="add" data-custom="1">ADD${cu ? ' +' : ''}</button></div></div>`;
  h += '</div>';
  if (!rows.length && ql) h += '<div class="card" style="text-align:center;margin-top:10px;color:var(--mu);font-weight:700">Ye service nahi mili. "Kuch aur / Custom" se apni zarurat likh sakte hain.</div>';
  $('grid').innerHTML = h;
}
$('q').addEventListener('input', e => { query = e.target.value; drawShop(); });
$('offersBar').addEventListener('click', e => { const b = e.target.closest('[data-ofbar]'); if (!b) return; const of = offersList().find(o => o.id === b.dataset.ofbar); if (!of) return; offerId = of.id; lsSet('instaOffer', offerId); toast('🎁 ' + of.title + ' select ho gaya' + (cart.length ? '' : '. Services add karein, cart mein lag jayega.') + (of.code ? ' (Code: ' + of.code + ')' : ''), 4500); drawCartBar(); });
$('cats').addEventListener('click', e => { const b = e.target.closest('[data-c]'); if (!b) return; cat = b.dataset.c; drawShop(); });
$('grid').addEventListener('click', e => {
  const t = e.target;
  const a = t.closest('[data-add]'), inc = t.closest('[data-inc]'), dec = t.closest('[data-dec]'), cu = t.closest('[data-custom]');
  if (a || inc) {
    const id = (a || inc).dataset.add || (a || inc).dataset.inc, c = catalog().find(x => x.id === id); if (!c) return;
    const l = cart.find(x => x.sid === id);
    if (l) l.qty = Math.min(20, l.qty + 1); else cart.push({ sid: id, item: c.item, service: c.service, rate: num(c.price), mins: num(c.mins) || 30, qty: 1, note: '' });
  } else if (dec) {
    const l = cart.find(x => x.sid === dec.dataset.dec); if (!l) return;
    l.qty--; if (l.qty <= 0) cart = cart.filter(x => x !== l);
  } else if (cu) {
    cart.push({ sid: '', custom: true, item: 'Custom', service: '', rate: 0, mins: 60, qty: 1, note: '' }); toast('Custom item cart mein add hua. Cart mein jaakar likhein.');
  } else return;
  lsSet('instaCart', cart); drawShop(); drawCartBar();
});

/* ---------- cart ---------- */
const cartCount = () => cart.reduce((t, l) => t + l.qty, 0);
const cartTotal = () => r2(cart.reduce((t, l) => t + l.rate * l.qty, 0));
const cartEta = () => cart.reduce((m, l) => Math.max(m, num(l.mins) || 30), 0) + Math.max(0, cart.length - 1) * 5;
function drawCartBar() {
  const n = cartCount(), onShop = !$('v-shop').classList.contains('hide'), overlay = !$('ovCart').classList.contains('hide') || !$('ov').classList.contains('hide');
  $('cartbar').classList.toggle('hide', !n || !onShop || overlay);
  if (n) $('cbL').innerHTML = `${n} item${n > 1 ? 's' : ''} · ${money(cartTotal())}${cart.some(l => l.custom) ? '+' : ''}<small>⏱ ~${esc(etaTxt(cartEta()))} mein ready</small>`;
}
$('cartbar').addEventListener('click', () => { reqEta = 0; openCart(); });
function openCart() { $('ovCart').classList.remove('hide'); document.body.style.overflow = 'hidden'; drawCart(); $('ovCart').scrollTop = 0; drawCartBar(); }
function closeCart() { $('ovCart').classList.add('hide'); document.body.style.overflow = $('ov').classList.contains('hide') ? '' : 'hidden'; drawCartBar(); }
$('cartX').addEventListener('click', closeCart);

/* ---------- registration (naam sirf pehli baar) ---------- */
const REG = { m: '', name: '', known: false };
async function lookupReg(m) {
  if (!db || !m) return; REG.m = m; REG.known = false; REG.name = ''; applyReg();
  try { const sn = await db.ref('instaCustomers/' + m).once('value'), v = sn.val(); if (REG.m !== m) return; if (v && v.name) { REG.known = true; REG.name = v.name; } } catch (e) { }
  applyReg(); if (typeof drawProfile === 'function') drawProfile();
}
function applyReg() {
  const w = $('nameWrap'), st = $('regStat'); if (!w) return;
  w.classList.toggle('hide', REG.known);
  if (st) {
    const mine = getAuth() && getAuth().m === REG.m || (lsGet('instaMobile', '') === REG.m && lsGet('instaMy', []).length);
    st.innerHTML = REG.known && mine ? '<div class="regok">✓ ' + esc(REG.name) + '</div>' : '';
  }
}

/* ---------- offers ---------- */
const todayStr = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
const offersList = () => arr(S.offers).filter(o => o && o.on !== false && o.title && (!o.validTill || String(o.validTill).slice(0, 10) >= todayStr()));
const offerOK = (of, sub) => !!of && sub >= num(of.min) && sub > 0;
function offerDisc(of, sub) { if (!of) return 0; let d = of.type === 'flat' ? num(of.value) : sub * num(of.value) / 100; if (of.type !== 'flat' && num(of.max) > 0) d = Math.min(d, num(of.max)); return r2(Math.max(0, Math.min(d, sub))); }
let offerId = lsGet('instaOffer', null);
const curOffer = () => offersList().find(o => o.id === offerId) || null;

function upcomingSlots() {

const MAXCH = 30000;
function compress(file) {
  return new Promise(resolve => {
    if (!file || !/^image\//.test(file.type || '')) { resolve(null); return; }
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      try {
        const w0 = img.naturalWidth || img.width, h0 = img.naturalHeight || img.height; if (!w0 || !h0) throw 0;
        let best = null;
        outer: for (const md of [640, 560, 480, 400, 320]) {
          const sc = Math.min(1, md / Math.max(w0, h0)), cv = document.createElement('canvas');
          cv.width = Math.max(1, Math.round(w0 * sc)); cv.height = Math.max(1, Math.round(h0 * sc));
          const cx = cv.getContext('2d'); cx.fillStyle = '#fff'; cx.fillRect(0, 0, cv.width, cv.height); cx.drawImage(img, 0, 0, cv.width, cv.height);
          for (const q of [0.7, 0.6, 0.5, 0.4]) { const d = cv.toDataURL('image/jpeg', q); if (!best || d.length < best.length) best = d; if (d.length <= MAXCH) { best = d; break outer; } }
        }
        URL.revokeObjectURL(url); resolve(best);
      } catch (e) { URL.revokeObjectURL(url); resolve(null); }
    };
    img.onerror = () => { URL.revokeObjectURL(url); resolve(null); };
    img.src = url;
  });
}

  const room = 3 - photos.length; if (room <= 0) { toast('Maximum 3 photos.'); return; }
  for (const f of files.slice(0, room)) { const d = await compress(f); if (d) photos.push(d); else toast('Ek photo padh nahi paye.'); }
  const th = $('thumbs'); if (th) th.innerHTML = thumbs();
});

    const n = r && r.snapshot ? r.snapshot.val() : null; if (n) return 'INS-' + n;
  } catch (e) { }
  return 'INS-' + String(Date.now()).slice(-6);
}

async function placeOrder() {
  if (busy) return;

  if (S.open === false) { toast('Abhi Insta orders band hain.'); return; }

  if (S.requireLogin && !authOK(m)) { toast('Order ke liye pehle WhatsApp OTP se login karein.', 4000); openLogin(m, () => { openCart(); }); return; }
  const bad = cart.find(l => l.custom && !String(l.note || '').trim());
  if (bad) { toast('Custom item mein likhein ki kya karwana hai.'); return; }
  if (Date.now() - lsGet('instaLast', 0) < 15000) { toast('Thoda ruk kar dobara try karein.'); return; }
  const sp = pickSlot();
  if (!sp.cur) { toast('Abhi koi slot khali nahi hai. Thodi der baad try karein.', 4500); return; }

  enableAlerts(false);

    if (!tr.committed) { toast('⚠ Ye slot abhi full ho gaya. Agla slot chuna ja raha hai.', 5000); busy = false; slotSel = null; drawCart(); return; }
    reserved = sk;
    const key = db.ref('instaOrders').push().key, no = await nextNumber(), now = new Date().toISOString(), st0 = S.stages[0], est = cartEta(), eta = Math.max(reqEta, est);
    const sub = cartTotal(), of = curOffer(), okOf = of && offerOK(of, sub), disc = okOf ? offerDisc(of, sub) : 0;
    const order = {

    reserved = null;
